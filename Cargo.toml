[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/mohnishbasha/stokeai-yuyin"

# Shared dependency versions (ARCHITECTURE section 19). Crates opt in with `{ workspace = true }`.
[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

# Shared lints. Every crate inherits these with `[lints] workspace = true`,
# except yuyin-engine and yuyin-audio, which repeat them with `unsafe_code = "deny"`
# because FFI may need documented `#[allow(unsafe_code)]` blocks there.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
# Pedantic allowlist. Each entry needs a reason.
# module_name_repetitions: crate-prefixed type names (YuyinError) read better at call sites.
module_name_repetitions = "allow"
