# Backing services for `make dev` and scripts/dev.sh (ARCHITECTURE 16.3, path 2a).
# The gateway and console run on the host. Ports bind to 127.0.0.1 only.
name: yuyin-dev

services:
  postgres:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_USER: yuyin
      POSTGRES_PASSWORD: yuyin-dev-only
      POSTGRES_DB: yuyin
    ports:
      - "127.0.0.1:${YUYIN_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuyin -d yuyin"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${YUYIN_DEV_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    ports:
      - "127.0.0.1:${YUYIN_DEV_STRIPE_PORT:-12111}:12111"
    # The image has no shell or HTTP client, so readiness is checked by scripts/dev.sh.

volumes:
  postgres-data:
