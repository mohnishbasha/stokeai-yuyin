name: setup
description: Install the pinned Rust toolchain, Bun, uv, and project dependencies.
inputs:
  rust-cache-key:
    description: Extra key for the Rust build cache
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Rust toolchain from rust-toolchain.toml
      shell: bash
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustc --version
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.rust-cache-key }}
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.13.5
    - name: Install dependencies
      shell: bash
      run: |
        bun install --frozen-lockfile
        uv sync --project packages/sdk-python --frozen
