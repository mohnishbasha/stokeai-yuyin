version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /packages/sdk-python
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/docker
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
