# CI for every pull request and every push to develop (ARCHITECTURE 16.6, SPRINT_PLAN S0-T04).
# Job graph:
#   lint-and-typecheck (amd64, arm64)
#     -> unit-tests -> coverage
#                   -> integration-tests -> e2e-tests
#                   -> contract-tests
#   version-check        PRs to staging and main
#   cli-matrix           stub, active from Sprint 8
#   harness-smoke-tests  stub, active from Sprint 10
name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: 8.30.1

jobs:
  lint-and-typecheck:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: ${{ matrix.runner }}
      - name: Lint (cargo fmt, clippy, eslint, prettier, OpenAPI)
        run: make lint
      - name: Type-check (tsc)
        run: make type-check

  unit-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests (cargo test, vitest, pytest)
        run: make test
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scaffold smoke tests
        run: bash tests/scaffold/run.sh

  coverage:
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Coverage against .coverage-thresholds.toml
        run: scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.16-alpine
        env:
          POSTGRES_USER: yuyin
          POSTGRES_PASSWORD: yuyin-ci-only
          POSTGRES_DB: yuyin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yuyin -d yuyin" --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://yuyin:yuyin-ci-only@127.0.0.1:5432/yuyin
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Service containers reachable
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U yuyin
          exec 3<>/dev/tcp/127.0.0.1/6379 && printf 'PING\r\n' >&3 && head -c 7 <&3 | grep -q PONG
      - name: Integration tests
        # Integration suites (tests/integration, crates/*/tests) arrive from Sprint 2.
        run: cargo test --workspace --locked --tests
      - name: Gateway smoke against the built binary
        run: |
          cargo build -p yuyin-gateway --locked
          YUYIN_BIND=127.0.0.1:8080 target/debug/yuyin-gateway serve &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          YUYIN_SMOKE_URL=http://127.0.0.1:8080 make smoke

  contract-tests:
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: OpenAPI lint
        run: bun run lint:openapi
      - name: SDK type drift check
        # Compares the generated SDK types with api/openapi.yaml once the SDKs exist (S5-T03, S5-T04).
        run: "echo 'SDK type drift check: available from Sprint 5'"

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Dev stack end to end (scripts/dev.sh, all services, /healthz)
        run: bash tests/scaffold/e2e_devstack_startup_allservices_healthzreturns200.sh
      - name: Clean clone builds in a fresh container (PRs to staging)
        if: github.base_ref == 'staging'
        run: bash tests/scaffold/e2e_make_setupbuildcheck_freshcontainer_exitszero.sh
      - name: Playwright against the local stack
        # The Playwright harness arrives with S2-T09.
        run: "echo 'Playwright e2e: available from Sprint 2'"

  version-check:
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: All manifests match VERSION
        run: scripts/check-versions.sh

  cli-matrix:
    # Builds and smoke-tests the CLI on macOS, Linux, and Windows. Active from Sprint 8, when
    # the CLI exists; until then the job is skipped.
    name: cli-matrix (stub, active from Sprint 8)
    if: ${{ false }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: "echo 'cli-matrix: available from Sprint 8'"

  harness-smoke-tests:
    # Runs the agent harness smoke tests on PRs to staging and on release tags. Active from
    # Sprint 10; until then the job is skipped.
    name: harness-smoke-tests (stub, active from Sprint 10)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: "echo 'harness-smoke-tests: available from Sprint 10'"
