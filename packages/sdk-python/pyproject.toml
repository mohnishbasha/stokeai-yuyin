[project]
name = "yuyin"
version = "0.1.0"
description = "Yuyin Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yuyin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
